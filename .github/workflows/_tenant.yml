name: tenant

on:
  workflow_call:
    inputs:
      tenant:
        type: string
        required: true
      client_id:
        type: string
        required: true
      apply:
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: ${{ inputs.apply && 'Apply' || 'Plan' }} ${{ inputs.tenant }}
    runs-on: ubuntu-latest
    concurrency:
      group: ca-${{ inputs.tenant }}
      cancel-in-progress: false
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      TF_VAR_client_id: ${{ inputs.client_id }}
      TF_VAR_use_oidc: "true"
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false -backend-config="key=ca-${{ inputs.tenant }}.tfstate"

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -input=false -var-file="tenants/${{ inputs.tenant }}.tfvars" -out tfplan

      - name: Plan summary
        run: |
          echo "### ${{ inputs.tenant }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          terraform show -no-color tfplan >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Apply
        if: inputs.apply
        run: terraform apply -input=false tfplan
